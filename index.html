<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot BLE Controller</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #2c3e50; color: white; }
        .btn { width: 95px; height: 95px; margin: 10px; font-size: 18px; font-weight: bold; border-radius: 15px; border: none; background-color: #e67e22; color: white; touch-action: manipulation; -webkit-user-select: none; }
        .btn:active { background-color: #d35400; transform: scale(0.95); }
        .status-box { padding: 15px; margin-bottom: 20px; border-radius: 10px; background: #34495e; text-align: center; width: 80%; }
        #connectBtn { padding: 15px 30px; font-size: 18px; background: #27ae60; border: none; color: white; border-radius: 8px; cursor: pointer; box-shadow: 0 4px #1e8449; }
        #connectBtn:active { box-shadow: 0 0; transform: translateY(4px); }
    </style>
</head>
<body>
    <div class="status-box">
        <div id="statusText">Status: 🔴 Ready to Connect</div>
        <div id="debugLog" style="font-size: 10px; color: #bdc3c7; margin-top: 5px;"></div>
    </div>

    <button id="connectBtn" onclick="connectBLE()">PAIR & START</button>

    <div id="controls" style="display:none; text-align: center;">
        <button class="btn" ontouchstart="start('w')" ontouchend="stop()">UP</button><br>
        <button class="btn" ontouchstart="start('a')" ontouchend="stop()">LEFT</button>
        <button class="btn" ontouchstart="start('s')" ontouchend="stop()">DOWN</button>
        <button class="btn" ontouchstart="start('d')" ontouchend="stop()">RIGHT</button>
    </div>

    <script>
        let robotChar;
        let moveInterval;
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        function log(msg) {
            document.getElementById('debugLog').innerText = msg;
            console.log(msg);
        }

        async function connectBLE() {
            log("Searching for ESP32-Robot...");
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-Robot' }],
                    optionalServices: [SERVICE_UUID]
                });

                log("Connecting to GATT Server...");
                const server = await device.gatt.connect();
                
                log("Locating Service...");
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                log("Locating Characteristic...");
                robotChar = await service.getCharacteristic(CHAR_UUID);
                
                document.getElementById('statusText').innerText = "Status: 🟢 Connected!";
                document.getElementById('connectBtn').style.display = "none";
                document.getElementById('controls').style.display = "block";
                log("Ready for input.");

                device.addEventListener('gattserverdisconnected', () => {
                    location.reload(); // Refresh page if connection drops
                });

            } catch (error) {
                log("Error: " + error.message);
                alert("Connection Failed: " + error.message);
            }
        }

        async function send(val) {
            if (robotChar) {
                try {
                    await robotChar.writeValue(new TextEncoder().encode(val));
                } catch (e) {
                    log("Send Error: " + e.message);
                }
            }
        }

        function start(c) {
            if (moveInterval) return; 
            send(c);
            moveInterval = setInterval(() => { send(c); }, 100); // Matches your 100ms original logic [cite: 7]
        }

        function stop() {
            clearInterval(moveInterval);
            moveInterval = null; // Clean up interval 
            send('S'); 
        }
    </script>
</body>
</html>
